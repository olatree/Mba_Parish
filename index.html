<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harvest Thanksgiving 2026</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a; /* Deep, elegant neutral page background */
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      /* Card background image with dark overlay to make white text pop */
      background: linear-gradient(rgba(15, 23, 42, 0.78), rgba(15, 23, 42, 0.78)),
                  url('background.jpg') no-repeat center center;
      background-size: cover;
      padding: 36px 24px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      color: #f8fafc;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    #message {
      font-size: 1.25rem;
      line-height: 1.6;
      color: #ffffff;
      margin-bottom: 28px;
      font-weight: 500;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    /* Side-by-side images container */
    .image-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .image-row img {
      width: 45%;
      height: 110px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      background-color: #ffffff; /* Gives clean padding if using transparent logos */
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Harvest Thanksgiving 📢</div>
    <div id="message">Loading message...</div>

    <!-- Two small images inside the card below the text -->
    <div class="image-row">
      <img src="image1.jpg" alt="Church Logo">
      <img src="image2.jpg" alt="Parish Harvest Badge">
    </div>
  </div>

  <script>
    const quotes = [
      "Hallelujah! Get ready to rejoice and give thanks at our Annual Harvest Thanksgiving on Sunday, November 1st, 2026.",
      "Join us in your spotless white sutana as we bring our thanksgiving and praises before the Lord.",
      "Early attendance is a sign of honor to God; please come early and secure your seat in the presence of the Lord.",
      "The altar is prepared, the choir is ready—do not arrive late to God’s sanctuary on November 1st!",
      "A harvest of joy, peace, and abundance awaits you—bring someone along to receive their portion of blessings.",
      "Come with a heart full of gratitude and a joyful offering, for God loves a cheerful giver.",
      "Prepare your seeds of faith and special thanksgiving offerings; the Lord will reward your labor of love.",
      "November 1st, 2026 is a divine appointment with your Creator—make sure nothing keeps you away!",
      "Put on your garment of praise and let your Thanksgiving dance glorify our Heavenly Father.",
      "Bring a soul to the church on November 1st and let them witness the beauty of worshiping in spirit and in truth.",
      "Hallelujah! See you on Sunday, November 1st, 2026, for an unforgettable day of divine blessings.",
      "Hallelujah! The Holy Spirit just whispered to us that you are planning to come late on November 1st. Change your ways!",
      "Congratulations! You have unlocked VIP seating near the choir... provided you show up by 10:00 AM on Sunday!",
      "Warning: Showing up empty-handed to Harvest Thanksgiving may cause your Thanksgiving rice to taste like ordinary boiled water.",
      "Don’t bring folded 100 Naira notes looking like origami. Come prepared with a joyful offering, Omo Ijo Mimo!",
      "Hallelujah! Since you had the energy to scan this, you officially have the energy to shout seven victorious Hallelujahs on November 1st!"
    ];

    const picked = quotes[Math.floor(Math.random() * quotes.length)];
    document.getElementById("message").innerText = picked;
  </script>

</body>
</html>
